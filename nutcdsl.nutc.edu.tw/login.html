    <title>登入系統 — 跨領域數位自主學習平台 · 國立臺中科技大學</title>
</head>

<body>
    <a class="skip-link a11y-hidden" href="#main">跳到主要內容</a>
    <a class="accesskey" id="U" href="#U" accesskey="U" title="上方導覽連結區">:::</a>

    <div class="login">

        <!-- 背景裝飾，不傳達資訊 -->
        <div class="login__deco" aria-hidden="true">
            <img class="band-1" src="images/login/band-1.svg" alt="" />
            <img class="band-2" src="images/login/band-2.svg" alt="" />
            <img class="band-3" src="images/login/band-3.svg" alt="" />
            <img class="band-4" src="images/login/band-4.svg" alt="" />
            <img class="band-5" src="images/login/band-5.svg" alt="" />
            <img class="band-6" src="images/login/band-6.svg" alt="" />
            <img class="streak-1" src="images/login/streak-1.svg" alt="" />
            <img class="streak-2" src="images/login/streak-2.svg" alt="" />
            <img class="streak-3" src="images/login/streak-3.svg" alt="" />
            <img class="streak-4" src="images/login/streak-4.svg" alt="" />
            <img class="center-glow" src="images/login/center-glow.svg" alt="" />
            <img class="dots" src="images/login/dots.svg" alt="" />
        </div>
        <div class="login__vignette" aria-hidden="true"></div>

        <!-- 語言切換 -->
        <div class="login__lang">
            <a class="btn-lang" href="#" lang="en" hreflang="en">
                <img src="images/icons/globe.svg" alt="" width="14" height="14" aria-hidden="true" />
                EN<span class="a11y-hidden">（切換至英文版）</span>
            </a>
        </div>

        <a class="accesskey" id="C" href="#C" accesskey="C" title="中央內容區塊">:::</a>
        <main class="login__inner" id="main">
            <img class="login__logo" src="images/login/logo-lockup.png" alt="國立臺中科技大學" />

            <h1 class="login__title">跨領域數位<br class="login__br" />自主學習平台</h1>

            <a class="login__btn" href="index.html">
                <span class="login__btn-surface">
                    <img src="images/icons/user-login.svg" alt="" aria-hidden="true" />
                    <span class="login__btn-text">登入系統</span>
                </span>
            </a>
        </main>

        <a class="accesskey" id="Z" href="#Z" accesskey="Z" title="下方版權資訊區">:::</a>
        <p class="login__copy">Copyright © 國立臺中科技大學 版權所有</p>
    </div>

    <script src="js/jquery-3.7.1.min.js"></script>
    <script src="js/popper-1.16.1.min.js"></script>
    <script src="assets/bootstrap/js/bootstrap.min.js"></script>
    <script src="js/script.js"></script>
