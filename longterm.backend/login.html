<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>登入│臺南市政府社會局─長期照顧管理中心</title>
    <link rel="shortcut icon" href='images/favicon.ico' />
    <link rel="image_src" href='images/favicon.ico' type="image/jpeg" />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500&family=Noto+Serif+TC:wght@500&family=Oswald:wght@500&display=swap">
    <link rel="stylesheet" href="assets/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/bootstrap-select/css/bootstrap-select.min.css" />
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="css/login.css" />
</head>

<body>
        
    
    <div class="form-wrap">

        <div class="row">
            <div class="col-xl-6 d-none d-xl-block">
                <div class="bg"></div>
                <!-- <img class="visual" src="images/img-login.jpg" alt="臺南市政府社會局─長期照顧管理中心"> -->
            </div>
            <div class="col-xl-6">
                <form class="form-signin">
                    <div class="brand-text">
                        <img src="images/logo.png" alt="臺南市政府社會局─長期照顧管理中心">
                        <span>聯護管理系統</span>
                    </div>

                    <div class="title">登入
                        <a class="register" href="register.html">註冊</a>
                    </div>
            
                    <div class="form-group has-float-label">
                        <input type="text" class="form-control" id="taxID" placeholder="請輸入公司統編" onfocus="this.placeholder = ''" required autofocus>
                        <label for="taxID">請輸入公司統編</label>
                    </div>
                    <div class="form-group has-float-label">
                        <input type="text" class="form-control" id="FinancialInstitutionsCode" placeholder="請輸入機構代碼" onfocus="this.placeholder = ''" required autofocus>
                        <label for="FinancialInstitutionsCode">請輸入機構代碼</label>
                    </div>
                    
                    <div class="form-group has-float-label">
                        <input type="password" class="form-control" id="password" placeholder="請輸入密碼" onfocus="this.placeholder = ''" required autofocus>
                        <label for="password">請輸入密碼</label>
                    </div>

                    <div class="form-group">
                        <label class="sr-only" for="vcode">驗證碼</label>
                        <div class="input-group">
                            <input type="text" class="form-control" id="vcode" placeholder="請輸入驗證碼" required="">
                            <div class="input-group-append" id="button-addon4">
                                <img src="images/captcha-img.png" alt="captcha">
                            </div>
                        </div>
                    </div>

                    <!-- <fieldset class="form-group">
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="remember">
                            <label class="form-check-label" for="remember">記住我</label>
                        </div>
                    </fieldset>

                    <div class="reCAPTCHA">
                        <a href="#">
                            <img src="images/reCAPTCHA.jpg">
                        </a>
                    </div> -->
                    
                    <button class="btn btn-lg btn-block btn-signin" type="button" onclick="window.location.href='company.html';">登入</button>
                    
            
                    <div class="forgot-register">
                        <a class="forgot" href="forget.html">忘記密碼</a>
                    </div>
                </form>
            </div>
        </div>
        
        
    </div>

    <footer>
            
        <p class="copyright">Copyright © 臺南市政府社會局─長期照顧管理中心</p>
    </footer>

        
    
    
    
    

    <!--JS-->
    <!-- <script src='js/jquery-3.5.1.min.js'></script> -->
    <script src='https://cdnjs.cloudflare.com/ajax/libs/jquery/2.1.3/jquery.min.js'></script>
    <script src="js/popper.min.js"></script>
    <script src='assets/bootstrap/js/bootstrap.min.js'></script>
    <script src='assets/bootstrap-select/js/bootstrap-select.min.js'></script>
    <script src="assets/bootstrap-select/js/i18n/defaults-zh_TW.js"></script>
    <script src="js/script.js?1"></script>


</body>

</html>
