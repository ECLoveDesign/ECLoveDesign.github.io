<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>註冊│臺南市政府社會局─長期照顧管理中心</title>
    <link rel="shortcut icon" href='images/favicon.ico' />
    <link rel="image_src" href='images/favicon.ico' type="image/jpeg" />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500&family=Noto+Serif+TC:wght@500&family=Oswald:wght@500&display=swap">
    <link rel="stylesheet" href="assets/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/bootstrap-select/css/bootstrap-select.min.css" />
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="css/login.css" />
</head>

<body>


    <div class="form-wrap">
        <div class="brand-text d-md-flex">
            <img src="images/logo.png" alt="臺南市政府社會局─長期照顧管理中心">
            <span>聯護管理系統</span>
        </div>

        <form class="form-register">

            <div class="title">申請帳號填寫</div>


            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="taxID">母公司統編</label>
                        <input type="text" class="form-control" id="taxID" placeholder="請輸入公司統編" required>
                    </div>

                    <div class="form-group">
                        <label for="password">密碼</label>
                        <input type="password" class="form-control" id="password" placeholder="請輸入密碼" required>
                    </div>

                    <div class="form-group">
                        <label for="checkpassword">確認密碼</label>
                        <input type="password" class="form-control" id="checkpassword" placeholder="請輸入密碼" required>
                    </div>

                    <div class="form-group">
                        <label for="email">信箱</label>
                        <input type="email" class="form-control" id="email" placeholder="請輸入信箱" required>
                        <small id="emailHelp" class="form-text text-muted">請填寫能收信的信箱</small>
                    </div>


                </div>
                <div class="col-md-6">

                    <div class="form-group">
                        <label for="FinancialInstitutionsName">機構名稱 (全名)</label>
                        <input type="text" class="form-control" id="FinancialInstitutionsName" placeholder="請輸入機構全名"
                            required>
                    </div>


                    <div class="form-group">
                        <label for="FinancialInstitutionsAddress">機構地址</label>
                        <div class="form-row input-group">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <select class="form-control selectpicker" title="請選擇地址" data-live-search="true"
                                        required>
                                        <option value="基隆市">基隆市</option>
                                        <option value="臺北市">臺北市</option>
                                        <option value="新北市">新北市</option>
                                        <option value="桃園市">桃園市</option>
                                        <option value="新竹市">新竹市</option>
                                        <option value="新竹縣">新竹縣</option>
                                        <option value="苗栗縣">苗栗縣</option>
                                        <option value="臺中市">臺中市</option>
                                        <option value="彰化縣">彰化縣</option>
                                        <option value="南投縣">南投縣</option>
                                        <option value="雲林縣">雲林縣</option>
                                        <option value="嘉義市">嘉義市</option>
                                        <option value="嘉義縣">嘉義縣</option>
                                        <option value="臺南市">臺南市</option>
                                        <option value="高雄市">高雄市</option>
                                        <option value="屏東縣">屏東縣</option>
                                        <option value="臺東縣">臺東縣</option>
                                        <option value="花蓮縣">花蓮縣</option>
                                        <option value="宜蘭縣">宜蘭縣</option>
                                        <option value="澎湖縣">澎湖縣</option>
                                        <option value="金門縣">金門縣</option>
                                        <option value="連江縣">連江縣</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <select class="form-control selectpicker" title="請選擇區域" required>
                                        <option value="萬里區">萬里區</option>
                                        <option value="金山區">金山區</option>
                                        <option value="板橋區">板橋區</option>
                                        <option value="汐止區">汐止區</option>
                                        <option value="深坑區">深坑區</option>
                                        <option value="石碇區">石碇區</option>
                                        <option value="瑞芳區">瑞芳區</option>
                                        <option value="平溪區">平溪區</option>
                                        <option value="雙溪區">雙溪區</option>
                                        <option value="貢寮區">貢寮區</option>
                                        <option value="新店區">新店區</option>
                                        <option value="坪林區">坪林區</option>
                                        <option value="烏來區">烏來區</option>
                                        <option value="永和區">永和區</option>
                                        <option value="中和區">中和區</option>
                                        <option value="土城區">土城區</option>
                                        <option value="三峽區">三峽區</option>
                                        <option value="樹林區">樹林區</option>
                                        <option value="鶯歌區">鶯歌區</option>
                                        <option value="三重區">三重區</option>
                                        <option value="新莊區">新莊區</option>
                                        <option value="泰山區">泰山區</option>
                                        <option value="林口區">林口區</option>
                                        <option value="蘆洲區">蘆洲區</option>
                                        <option value="五股區">五股區</option>
                                        <option value="八里區">八里區</option>
                                        <option value="淡水區">淡水區</option>
                                        <option value="三芝區">三芝區</option>
                                        <option value="石門區">石門區</option>
                                    </select>
                                </div>
                            </div>

                            <div class="col-12">
                                <label class="sr-only" for="detailAddress">Name</label>
                                <input type="text" class="form-control" id="detailAddress" placeholder="請輸入詳細地址">
                            </div>
                        </div>
                    </div>


                    <div class="form-group">
                        <label for="companyPerson">機構負責人</label>
                        <input type="text" class="form-control" id="companyPerson" placeholder="請輸入機構負責人名" required>
                    </div>

                    <div class="form-group">
                        <label for="vcode">驗證碼</label>
                        <div class="input-group">
                            <input type="text" class="form-control" id="vcode" placeholder="請輸入驗證碼" required="">
                            <div class="input-group-append" id="button-addon4">
                                <img src="images/captcha-img.png" alt="captcha">
                            </div>
                        </div>
                    </div>

                </div>
            </div>


            <button class="btn btn-lg btn-block btn-signin" type="button"
                onclick="window.location.href='layout.html';">送出</button>
        </form>



    </div>

    <footer>

        <p class="copyright">Copyright © 臺南市政府社會局─長期照顧管理中心</p>
    </footer>







    <!--JS-->
    <!-- <script src='js/jquery-3.5.1.min.js'></script> -->
    <script src='https://cdnjs.cloudflare.com/ajax/libs/jquery/2.1.3/jquery.min.js'></script>
    <script src="js/popper.min.js"></script>
    <script src='assets/bootstrap/js/bootstrap.min.js'></script>
    <script src='assets/bootstrap-select/js/bootstrap-select.min.js'></script>
    <script src="assets/bootstrap-select/js/i18n/defaults-zh_TW.js"></script>
    <script src="js/script.js?1"></script>


</body>

</html>
